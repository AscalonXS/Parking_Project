<!DOCTYPE html>
<html>
<head>
    <title>Smart Parking System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .server {
            text-align: center;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 5px;
            background: #ddd;
        }

        .parking {
            display: grid;
            grid-template-columns: repeat(2, 250px);
            gap: 20px;
            justify-content: center;
        }

        .space {
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .available {
            background: #d8ffd8;
        }

        .occupied {
            background: #ffd8d8;
        }

        .space h2 {
            margin-top: 0;
        }

        .car {
            font-size: 50px;
            margin: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .park {
            background: #4CAF50;
            color: white;
        }

        .leave {
            background: #f44336;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Smart Parking System</h1>

    <div class="server">
        Server Status:

        <span id="serverStatus" class="status">
            Connected
        </span>
    </div>

    <div class="parking">

        <!-- Parking Space 1 -->
        <div id="space1" class="space available">

            <h2>Parking 1</h2>

            <div id="car1" class="car">
                🅿️
            </div>

            <p id="status1">
                AVAILABLE
            </p>

            <button class="park"
                    onclick="parkCar(1)">
                Park
            </button>

            <button class="leave"
                    onclick="leaveCar(1)">
                Leave
            </button>

        </div>


        <!-- Parking Space 2 -->
        <div id="space2" class="space available">

            <h2>Parking 2</h2>

            <div id="car2" class="car">
                🅿️
            </div>

            <p id="status2">
                AVAILABLE
            </p>

            <button class="park"
                    onclick="parkCar(2)">
                Park
            </button>

            <button class="leave"
                    onclick="leaveCar(2)">
                Leave
            </button>

        </div>


        <!-- Parking Space 3 -->
        <div id="space3" class="space available">

            <h2>Parking 3</h2>

            <div id="car3" class="car">
                🅿️
            </div>

            <p id="status3">
                AVAILABLE
            </p>

            <button class="park"
                    onclick="parkCar(3)">
                Park
            </button>

            <button class="leave"
                    onclick="leaveCar(3)">
                Leave
            </button>

        </div>


        <!-- Parking Space 4 -->
        <div id="space4" class="space available">

            <h2>Parking 4</h2>

            <div id="car4" class="car">
                🅿️
            </div>

            <p id="status4">
                AVAILABLE
            </p>

            <button class="park"
                    onclick="parkCar(4)">
                Park
            </button>

            <button class="leave"
                    onclick="leaveCar(4)">
                Leave
            </button>

        </div>

    </div>


    <script>

        function parkCar(space) {

            let parking = document.getElementById("space" + space);
            let status = document.getElementById("status" + space);
            let car = document.getElementById("car" + space);

            parking.classList.remove("available");
            parking.classList.add("occupied");

            status.innerHTML = "OCCUPIED";

            car.innerHTML = "🚗";

            console.log("PARK " + space);
        }


        function leaveCar(space) {

            let parking = document.getElementById("space" + space);
            let status = document.getElementById("status" + space);
            let car = document.getElementById("car" + space);

            parking.classList.remove("occupied");
            parking.classList.add("available");

            status.innerHTML = "AVAILABLE";

            car.innerHTML = "🅿️";

            console.log("LEAVE " + space);
        }

    </script>

</body>
</html>
